<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Professor</title><link rel="stylesheet" href="css/professor.css?v=1"><script src="js/gate.js?v=1"></script>
<style>body{overflow:auto}.wrap{max-width:1300px;margin:0 auto;padding:18px 14px 60px}.hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.hd h1{margin:0;font-size:clamp(22px,3vw,32px);flex:1}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.tile{display:block;text-decoration:none;color:inherit;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);overflow:hidden;transition:transform .15s,box-shadow .15s}.tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(40,50,120,.18)}
.tile .im{aspect-ratio:16/9;background:rgba(255,255,255,.3)}.tile svg{width:100%;height:100%;display:block;opacity:.95}.tile .tx2{padding:10px 12px}.tile b{display:block;font-size:15px}.tile small{color:var(--mut)}.num{position:absolute;margin:8px;padding:3px 9px;border-radius:999px;background:rgba(20,30,70,.72);color:#fff;font-weight:800;font-size:12px}.pos{position:relative}
.bar{display:flex;gap:8px;flex-wrap:wrap}.f{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--glass);font-weight:700}.f.on{background:var(--pri);color:#fff;border-color:var(--pri)}input.tx{max-width:260px}</style></head>
<body><div class="wrap"><div class="hd"><h1>Painel do Professor <small style="font-size:14px;color:var(--mut)">· Inglês · Maple Street</small></h1><input class="tx" id="q" placeholder="Buscar aula…"></div>
<div class="bar" id="bar" style="margin-bottom:14px"></div><div class="tiles" id="t"></div></div>
<script src="../js/obra-ficha-lib.js"></script><script src="../js/obra-ficha.js"></script><script src="../js/obra-ficha-scenes2.js"></script>
<script>
(async()=>{const ix=await fetch('data/index.json').then(r=>r.json());const L=ix.lessons;window.PogFichas={};L.forEach(l=>window.PogFichas[-l.n]=l.fic);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let lv='*',q='';
const prog=n=>{try{const d=JSON.parse(localStorage.getItem('pgprof-en-'+n+'-done')||'{}');return Object.keys(d).length}catch(e){return 0}};
function draw(){const f=L.filter(l=>(lv==='*'||l.level===lv)&&(!q||(l.title+l.pt).toLowerCase().includes(q)));document.getElementById('t').innerHTML=f.map(l=>{let s='';try{s=PogFicha.svg({n:-l.n},'cover')}catch(e){}const p=prog(l.n);return `<a class="tile" href="aula.html?n=${l.n}"><div class="pos"><span class="num">${l.level} · ${String(l.n).padStart(3,'0')}</span><div class="im">${s}</div></div><div class="tx2"><b>${esc(l.title)}</b><small>${esc(l.pt)} · ${l.minutes} min · ${l.slides} slides${p?` · ✔ ${p}`:''}</small></div></a>`}).join('')||'<p class="lead">Nenhuma aula.</p>'}
const lvs=['*',...new Set(L.map(l=>l.level))];document.getElementById('bar').innerHTML=lvs.map(x=>`<button class="f ${x===lv?'on':''}" data-l="${x}">${x==='*'?'Todas ('+L.length+')':x}</button>`).join('');
document.getElementById('bar').onclick=e=>{const b=e.target.closest('.f');if(!b)return;lv=b.dataset.l;document.querySelectorAll('.f').forEach(x=>x.classList.toggle('on',x===b));draw()};document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();draw()};draw()})();
</script></body></html>
