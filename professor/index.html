<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Professor</title><link rel="stylesheet" href="css/professor.css?v=1"><script src="js/gate.js?v=1"></script>
<style>body{overflow:auto}.wrap{max-width:1300px;margin:0 auto;padding:18px 14px 60px}.hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.hd h1{margin:0;font-size:clamp(22px,3vw,32px);flex:1}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.tile{display:block;text-decoration:none;color:inherit;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);overflow:hidden;transition:transform .15s,box-shadow .15s}.tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(40,50,120,.18)}
.tile .im{aspect-ratio:16/9;background:rgba(255,255,255,.3)}.tile svg{width:100%;height:100%;display:block;opacity:.95}.tile .tx2{padding:10px 12px}.tile b{display:block;font-size:15px}.tile small{color:var(--mut)}.num{position:absolute;margin:8px;padding:3px 9px;border-radius:999px;background:rgba(20,30,70,.72);color:#fff;font-weight:800;font-size:12px}.pos{position:relative}
.bar{display:flex;gap:8px;flex-wrap:wrap}.f{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--glass);font-weight:700}.f.on{background:var(--pri);color:#fff;border-color:var(--pri)}input.tx{max-width:260px}.uh{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;margin:10px 2px 0;padding-top:6px;border-top:2px solid var(--line)}.uh b{font-size:18px}.uh small{color:var(--mut)}.tile.soon{opacity:.55;pointer-events:none;filter:grayscale(.5)}.tile .tag2{position:absolute;right:0;margin:8px;padding:3px 9px;border-radius:999px;background:#2da44e;color:#fff;font-size:11px;font-weight:800;letter-spacing:.05em}</style></head>
<body><div class="wrap"><div class="hd"><h1>Painel do Professor <small style="font-size:14px;color:var(--mut)">· Inglês · Maple Street</small></h1><input class="tx" id="q" placeholder="Buscar aula…"><a href="formacao/index.html" style="text-decoration:none;background:linear-gradient(135deg,#0B7C88,#13A39B);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;white-space:nowrap">🎓 Formação de professores</a></div>
<div class="bar" id="cat" style="margin-bottom:10px"></div><div class="bar" id="bar" style="margin-bottom:14px"></div><div class="tiles" id="t"></div></div>
<script src="../js/obra-ficha-lib.js"></script><script src="../js/obra-ficha.js"></script><script src="../js/obra-ficha-scenes2.js"></script>
<script>
(async()=>{const J=u=>fetch(u).then(r=>r.json());
const ix=await J('data/index.json');const V2=new Set(await J('data/v2/index.json').then(j=>j.lessons.map(x=>x.n)).catch(()=>[]));const OLD=ix.lessons;
const QC=await J('data/v4/curriculum.json').catch(()=>[]);const CUR=QC.length?QC:await J('data/v3/curriculum.json').catch(()=>[]);const AV=QC.length?new Set(QC.map(x=>x.n)):new Set(await J('data/v3/available.json').catch(()=>[]));const ISQ=QC.length>0;const EL={};(await J('data/elenco.json').catch(()=>[])).forEach(p=>EL[p.name]=p);
window.PogFichas={};OLD.forEach(l=>window.PogFichas[-l.n]=l.fic);
CUR.forEach(c=>{window.PogFichas[-(2000+c.n)]={scene:c.scene,tod:'day',decor:[],cast:c.cast.filter(n=>EL[n]).map(n=>({p:Object.assign({},EL[n].look,{arms:'wave'})}))}});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let cat=CUR.length?'rl':'old',lv='*',q='';
const prog=n=>{try{const d=JSON.parse(localStorage.getItem('pgprof-en-'+n+'-done')||'{}');return Object.keys(d).length}catch(e){return 0}};
const svg=k=>{try{return PogFicha.svg({n:k},'cover')}catch(e){return ''}};
function drawRL(){const f=CUR.filter(l=>(lv==='*'||l.level===lv)&&(!q||(l.title+l.pt).toLowerCase().includes(q)));let last=-1,h='';
 f.forEach(l=>{if(l.unit.n!==last){last=l.unit.n;h+=`<div class="uh"><b>Unit ${l.unit.n} · ${esc(l.unit.name)}</b><small>${l.level} · ${l.unit.of} aulas</small></div>`}
  const ok=AV.has(l.n);h+=`<a class="tile ${ok?'':'soon'}" ${ok?`href="${ISQ||l.n<=50?`aula4.html`:`aula3.html`}?n=${l.n}"`:''}><div class="pos"><span class="num">${l.level} · ${String(l.n).padStart(3,'0')}</span>${ok?`<span class="tag2">${ISQ?'Quest':'Real-Life'}</span>`:'<span class="tag2" style="background:#8a93b4">Em breve</span>'}<div class="im">${svg(-(2000+l.n))}</div></div><div class="tx2"><b>${esc(l.title)}</b><small>${esc(l.pt)} · 60 min · particular e grupo${prog(l.n)?` · ✔`:''}</small></div></a>`});
 document.getElementById('t').innerHTML=h||'<p class="lead">Nenhuma aula.</p>'}
function drawOld(){const f=OLD.filter(l=>(lv==='*'||l.level===lv)&&(!q||(l.title+l.pt).toLowerCase().includes(q)));document.getElementById('t').innerHTML='<div class="uh"><b>Maple Street · formato anterior</b><small>aulas em slides (100)</small></div>'+f.map(l=>{const p=prog(l.n);return `<a class="tile" href="${V2.has(l.n)?'aula2.html':'aula.html'}?n=${l.n}"><div class="pos"><span class="num">${l.level} · ${String(l.n).padStart(3,'0')}</span>${V2.has(l.n)?'<span class="num" style="right:0;background:#e8438f">Livro didático</span>':''}<div class="im">${svg(-l.n)}</div></div><div class="tx2"><b>${esc(l.title)}</b><small>${esc(l.pt)} · ${l.minutes} min · ${l.slides} slides${p?` · ✔ ${p}`:''}</small></div></a>`}).join('')||'<p class="lead">Nenhuma aula.</p>'}
function draw(){const cs=cat==='rl'?CUR:OLD;const lvs=['*',...new Set(cs.map(l=>l.level))];if(!lvs.includes(lv))lv='*';
 document.getElementById('cat').innerHTML=[['rl',(ISQ?'Quest · inglês':'Real-Life English')+(CUR.length?' ('+AV.size+'/'+CUR.length+')':'')],['old','Maple Street · anterior']].filter(x=>x[0]==='old'||CUR.length).map(x=>`<button class="f ${x[0]===cat?'on':''}" data-c="${x[0]}">${x[1]}</button>`).join('');
 document.getElementById('bar').innerHTML=lvs.map(x=>`<button class="f ${x===lv?'on':''}" data-l="${x}">${x==='*'?'Todas ('+cs.length+')':x}</button>`).join('');
 (cat==='rl'?drawRL:drawOld)()}
document.getElementById('cat').onclick=e=>{const b=e.target.closest('.f');if(!b)return;cat=b.dataset.c;lv='*';draw()};
document.getElementById('bar').onclick=e=>{const b=e.target.closest('.f');if(!b)return;lv=b.dataset.l;draw()};document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();draw()};draw()})();
</script></body></html>
