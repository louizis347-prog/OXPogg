<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plano de encontro · Aula ao vivo</title>
<meta name="robots" content="noindex"><style>
:root{--ink:#14183a}*{box-sizing:border-box}body{margin:0;font:600 16px/1.6 system-ui,sans-serif;background:#FFF3D6;color:var(--ink)}
.top{padding:18px 16px;border-bottom:3px solid var(--ink);background:#FFC93C}.top a{color:var(--ink)}h1{margin:6px 0 0;font-size:26px}
main{max-width:900px;margin:0 auto;padding:16px}.card{background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:18px;margin-bottom:22px}
h2{margin:0 0 8px;font-size:18px;background:#FFE08A;display:inline-block;padding:2px 12px;border:3px solid var(--ink);border-radius:10px}
table{width:100%;border-collapse:collapse}th,td{border:2px solid var(--ink);padding:7px 10px;text-align:left;vertical-align:top}th{background:#FFC93C}
li{margin:4px 0}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.nav a,.nav button{padding:8px 14px;border:3px solid var(--ink);background:#fff;border-radius:99px;text-decoration:none;color:var(--ink);font:800 15px system-ui;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.pill{display:inline-block;padding:2px 10px;border:2px solid var(--ink);border-radius:99px;background:#FFC93C;font-size:13px;font-weight:800}
@media print{.top,.nav{display:none}.card{box-shadow:none;break-inside:avoid-page}body{background:#fff}}
</style></head><body><div class="top"><a href="aula-ao-vivo.html">← Kit do professor</a><h1 id="t">Plano de encontro</h1></div><main id="m">Carregando…</main>
<script>
const G={'en-pt':'🇵🇹 Inglês para quem mora em Portugal','pt-es':'🇪🇸 Português para falantes de espanhol','pt-en':'🇺🇸 Portuguese for English speakers'};
const q=new URLSearchParams(location.search),g=q.get('g')||'en-pt',n=+(q.get('n')||1);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
fetch('data/ao-vivo.json').then(r=>r.json()).then(D=>{
 const L=D.filter(e=>e.g===g),e=L.find(x=>x.n===n);
 if(!e){document.getElementById('m').textContent='Encontro não encontrado.';return}
 document.title='Encontro '+e.n+' · '+e.title;document.getElementById('t').textContent='Encontro '+e.n+' · '+e.title;
 const prev=L.find(x=>x.n===n-1),next=L.find(x=>x.n===n+1);
 const T=(h,rows)=>'<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
 document.getElementById('m').innerHTML=
 '<div class="nav">'+(prev?'<a href="?g='+g+'&n='+prev.n+'">← Encontro '+prev.n+'</a>':'')+'<span class="pill">'+G[g]+'</span>'+(next?'<a href="?g='+g+'&n='+next.n+'">Encontro '+next.n+' →</a>':'')+'<button onclick="print()">🖨️ Imprimir</button></div>'+
 '<div class="card"><h2>Objetivo</h2><p>'+esc(e.goal)+'</p></div>'+
 '<div class="card"><h2>Roteiro de 1h30</h2>'+T(['Min.','Momento','O que fazer'],[['0–10','Acolhida',e.warm],['10–25','Expressões-chave','Apresente as 10 expressões abaixo com pronúncia, exemplo e repetição em coro, depois um a um.'],['25–45','Prática guiada',e.guided.join(' • ')],['45–50','Pausa','5 minutos, câmeras e microfones desligados.'],['50–75','Produção livre',e.free],['75–85','Correção coletiva','Mostre 5 frases anotadas, sem expor o autor. Foque nos erros da tabela abaixo.'],['85–90','Fechamento','Recapitule 3 coisas aprendidas. Passe a tarefa e anuncie o próximo tema.']])+'</div>'+
 '<div class="card"><h2>Expressões-chave</h2>'+T(['Expressão','Sentido / tradução'],e.expr)+'</div>'+
 '<div class="card"><h2>Papéis da produção livre</h2><ul>'+e.cards.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul></div>'+
 '<div class="card"><h2>Erros para corrigir</h2>'+T(['Erro','Correto','Por quê'],e.fix)+'</div>'+
 '<div class="card"><h2>Tarefa</h2><p>'+esc(e.hw)+'</p></div>'+
 (e.apps.length?'<div class="card"><h2>Aulas do app para revisar antes</h2><ul>'+e.apps.map(a=>'<li>Aula '+a[0]+' · '+esc(a[1])+'</li>').join('')+'</ul></div>':'');
});
</script></body></html>
