name: Sincroniza manifesto e contadores

# manifest.json e counts.json são gerados dos blocos em data/. Se alguém (ou outra sessão)
# os sobrescrever com uma cópia antiga, este fluxo regrava a partir dos arquivos reais.
on:
  push:
    branches: [main]
    paths: ['data/**']
  pull_request:
    paths: ['data/**']

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - run: python3 tools/build_data_index.py
      - name: Commita se mudou
        run: |
          if ! git diff --quiet -- data/manifest.json data/counts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/manifest.json data/counts.json
            git commit -m "Sincroniza manifesto e contadores com os blocos de data/ [skip ci]"
            git push
          fi
