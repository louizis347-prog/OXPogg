name: Trava de qualidade dos cursos regulares

# Todo episódio dos cursos regulares marcado como regular-pilot-v1 precisa passar o contrato
# (tools/audit/regular_pilot_contract.py): a densidade dos episódios 2–5 do inglês, mais a ponte obra↔episódio e as expressões únicas
# (nenhuma expressão ensinada em dois episódios do mesmo curso; só a mochila repete). Falha nova = checagem vermelha.
# Para BLOQUEAR o merge, marque esta checagem como obrigatória em Settings > Branches (regra da main).
on:
  pull_request:
    paths: ['data/**', 'plano/**', 'tools/plan/**', 'tools/audit/**', 'js/obra-art.js']
  push:
    branches: [main]
    paths: ['data/**', 'plano/**', 'tools/plan/**', 'tools/audit/**', 'js/obra-art.js']

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trava dos episódios (contrato + obra única + aderência ao plano)
        run: python3 tools/audit/regular_gate.py
      - name: Autoteste da trava (cada defeito conhecido precisa reprovar)
        run: python3 tools/audit/test_gate.py
      - name: Valida a ponte cultural do inglês regular
        run: python3 tools/audit/english_bridge_gate.py
      - name: Trava de referências culturais e capas (3.000 obras e capas distintas)
        run: |
          npm install --no-save playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8123 >/dev/null 2>&1 &
          sleep 2
          PLAYWRIGHT="$PWD/node_modules/playwright" node tools/audit/trava_referencias_capas.js
      - name: Valida o mapeamento por episódio (obras, verbos, expressões únicos)
        run: |
          for f in plano/*.json; do
            c=$(basename "$f" .json)
            if ls tools/plan/map/${c}_*.json >/dev/null 2>&1; then
              echo "== $c"; python3 tools/plan/check_plan.py "$c"
            fi
          done
